name: probe-403

# 실패율 측정 전용 — 손으로만 돌린다.
# 러너 여러 대를 동시에 띄워 각자 한 번씩 요청한다. 한 실행 안에서는 IP 가 고정이라
# 재시도로는 알 수 없는 것을 본다: "판을 새로 잡으면 통할 확률이 얼마인가".
on:
  workflow_dispatch:
    inputs:
      runners:
        description: "동시에 띄울 러너 수"
        default: "6"

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - run: pip install requests
      - name: 한 번 요청
        run: |
          python - <<'PY'
          import requests
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
          H = {"User-Agent": UA, "Accept-Language": "ko-KR,ko;q=0.9",
               "Accept-Encoding": "gzip, deflate",
               "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"}
          try:
              ip = requests.get("https://api.ipify.org", timeout=10).text
          except Exception:
              ip = "?"
          r = requests.get("https://www.i-boss.co.kr/ab-1957?category_1=BCV",
                           headers=H, timeout=25)
          print(f"RESULT ip={ip} status={r.status_code} bytes={len(r.content)} "
                f"mitigated={r.headers.get('cf-mitigated','-')}")
          PY
