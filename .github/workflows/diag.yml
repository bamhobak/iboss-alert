name: diag-403

# 진단 전용 — 손으로만 돌린다. 러너에서 어떤 요청 방식이 403 을 피하는지 본다.
on:
  workflow_dispatch:
    inputs:
      which:
        description: "tls = TLS 지문 시험(기본), old = 예전 헤더 시험"
        default: "tls"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests "httpx[http2]" curl_cffi
      - run: python diag_tls.py
        if: inputs.which != 'old'
      - run: python diag_403.py
        if: inputs.which == 'old'
