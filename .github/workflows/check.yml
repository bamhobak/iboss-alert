name: iboss-alert

on:
  # GitHub 예약은 부하에 따라 밀리거나 통째로 유실된다(실측: 기대 10회 중 4회만 발화).
  # 짧은 간격일수록 더 밀린다. 그래서 이 예약은 '보험'이고,
  # 정시를 우리가 소유하려면 cron-job.org 같은 외부 스케줄러가
  # 아래 repository_dispatch 를 10분마다 때려 주는 쪽이 주 트리거다. (README 참고)
  # 2026-10-26: 9월엔 한 번도 안 뜨던 예약이 요즘 다시 살아났다. 그런데 cron-job.org 와
  # 같은 분(0·10·20…)에 떠서 두 판이 겹치고, state.json 푸시가 부딪혀 빨간불이 났다
  # (20일에 6번). 그래서 예약을 **겹치지 않는 시각**으로 옮긴다.
  #
  # 예약을 아예 빼지는 않는다 — cron-job.org 가 죽으면 아무도 안 돌고,
  # 그러면 '못 읽었다' 감시견조차 짖지 못한다(스크립트가 실행돼야 짖는다).
  # 매시 35분 한 번이면 그 조용한 죽음을 한 시간 안에 드러낸다.
  schedule:
    - cron: "35 * * * *"
  repository_dispatch:
    types: [check]
  workflow_dispatch:
    inputs:
      seed:
        description: "상태파일이 비어 있어도 알림 없이 기록만(첫 실행용)"
        type: boolean
        default: true
      dry_run:
        description: "텔레그램 전송 없이 로그만"
        type: boolean
        default: false

permissions:
  contents: write

# 겹쳐 돌면 같은 글을 두 번 알리거나 state.json 커밋이 충돌한다.
# 취소하지 않고 줄을 세운다 — 취소하면 이미 보낸 알림의 기록이 날아간다.
concurrency:
  group: iboss-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 게시판 확인 및 알림
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATEGORIES: ${{ vars.CATEGORIES || 'BCV' }}
          # 러너는 게시판에 직접 못 닿는다(클플 403, 러너 6대 6/6 실측).
          # 그래서 받아 오는 일만 Supabase 엣지 함수(서울)에 맡긴다. README 참고.
          FETCHER_URL: ${{ secrets.FETCHER_URL }}
          FETCHER_KEY: ${{ secrets.FETCHER_KEY }}
          SEED: ${{ (github.event_name == 'workflow_dispatch' && inputs.seed == false) && '0' || '1' }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        # 실패해도 state.json 은 커밋해야 한다(이미 보낸 알림의 기록이 들어 있다).
        # 그래서 여기서 종료코드를 삼키되, 맨 끝 step 에서 다시 내보내 빨간불을 유지한다.
        # continue-on-error 로 덮으면 알림이 죽어도 초록불이라 눈치를 못 챈다.
        run: |
          set +e
          python iboss_alert.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 상태 저장
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 변화 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 내 실행 결과를 따로 빼 둔다. 아래에서 작업트리를 원격 최신으로 되돌릴 것이기 때문이다.
          cp state.json "$RUNNER_TEMP/mine.json"

          # 예전 방식(commit 뒤 pull --rebase)은 state.json 한 파일을 양쪽이 고치면
          # 충돌로 멈췄다. 이제는 **원격 최신을 바닥에 깔고 내 기록을 얹는다** —
          # seen 은 합집합이라 어느 쪽 알림 기록도 버려지지 않는다.
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python merge_state.py "$RUNNER_TEMP/mine.json" || exit 1
            git add state.json
            if git diff --cached --quiet; then
              echo "원격이 이미 같은 내용이다 — 밀 것 없음"
              exit 0
            fi
            git commit -q -m "state: 확인한 글번호 갱신 [skip ci]"
            if git push -q; then
              echo "상태 저장 완료 (${i}회차)"
              exit 0
            fi
            echo "  ${i}회차 푸시 실패 — 원격을 다시 받아 얹는다"
            sleep $((i * 3))
          done
          echo "state.json 을 밀지 못했다" >&2
          exit 1

      - name: 결과 반영
        if: steps.run.outputs.code != '0'
        run: |
          echo "iboss_alert.py 가 ${{ steps.run.outputs.code }} 로 끝났다" >&2
          echo "  4 = 게시판을 30분 이상 못 읽었다(텔레그램으로 이미 알렸다)" >&2
          echo "  2 = 토큰/채널 설정 없음   1 = 일부 전송 실패" >&2
          echo "※ 한두 판 실패는 종료코드 0 으로 넘어간다 — 클플 챌린지가 간헐적으로 뜬다" >&2
          exit 1
